<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#167568"/>
  <!-- Heart with pulse cross — K-DuraCare hospital mark -->
  <!-- Cross (plus) shape -->
  <rect x="27" y="14" width="10" height="36" rx="3" fill="white"/>
  <rect x="14" y="27" width="36" height="10" rx="3" fill="white"/>
  <!-- Small heart cutout hint at centre -->
  <rect x="27" y="27" width="10" height="10" rx="1" fill="#167568"/>
  <!-- Small dot pulse indicator bottom-right -->
  <circle cx="50" cy="50" r="6" fill="#34d399"/>
</svg>